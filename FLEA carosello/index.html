<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Photo Collage Stream</title>
<style>
  /* ====== STAGE ====== */
  html, body {
    margin: 0;
    height: 100%;
    background: #e0e0e0;
    overflow: hidden;
  }

  #stage {
    position: fixed;
    inset: 0;
    /* PROFONDITÀ 3D: la perspective dà spessore alla leggera rotazione Y.
       NIENTE preserve-3d qui: così le card NON condividono lo spazio 3D e
       quindi non si compenetrano. Ogni card è un layer piatto impilato per
       z-index, ma conserva comunque la sua inclinazione 3D individuale. */
    perspective: 900px;
    perspective-origin: 50% 50%;
  }

  #scene {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transform: rotateY(-22deg);
  }

  /* .card = TRACK DEL FLUSSO: si occupa SOLO della traslazione orizzontale
     (da sinistra a destra). Ancorata al centro schermo; non viene mai scalata,
     così la dispersione applicata al figlio resta in pixel reali di schermo. */
  .card {
    position: absolute;
    top: 50%;
    left: 50%;
    will-change: transform;
    transform-style: preserve-3d;
  }

  /* .inner = ELEMENTO VISIVO: centraggio (xPercent/yPercent:-50), scala,
     rotazione e DISPERSIONE dell'esplosione. Essendo figlio di una .card solo
     traslata, i suoi offset x/y sono in px schermo -> esplosione circolare reale. */
  .card .inner {
    backface-visibility: hidden;
    will-change: transform;
  }

  /* ALTEZZA fissa, LARGHEZZA automatica -> proporzioni reali preservate,
     immagine sempre rettangolare e completa (nessun crop). */
  .card img {
    height: 340px;                 /* dimensione base della foto (a scala 1) */
    width: auto;
    display: block;
    border-radius: 4px;
    box-shadow: none;
    background: #1a1a1f;
  }

</style>
</head>
<body>
  <div id="stage"><div id="scene"></div></div>

  <!-- Elenco dei file nella cartella "FOTO DA USARE" (definisce imageFiles) -->
  <script src="images.js"></script>
  <!-- GSAP via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
  /* ============================================================
     CONFIGURAZIONE  (modifica liberamente questi valori)
     ============================================================ */

  // 1) ELENCO IMMAGINI — generato da images.js (tutti i file in "FOTO DA USARE").
  //    I nomi vengono codificati per gestire spazi, emoji e caratteri speciali.
  const IMG_FOLDER = 'FOTO DA USARE';
  const imageSources = imageFiles.map(
    name => encodeURIComponent(IMG_FOLDER) + '/' + encodeURIComponent(name)
  );

  // 2) VELOCITÀ DEL FLUSSO — durata (in secondi) della traversata completa
  //    da destra a sinistra. Più alto = flusso più lento.
  const FLOW_DURATION = 14;

  // 3) DENSITÀ — numero di contenitori riciclati nel DOM (Object Pooling).
  //    Determina anche quanto sono vicine le miniature nel "rullino".
  const POOL_SIZE = 44;

  // 4) DIMENSIONI / SCALE
  const THUMB_SCALE = 0.18;   // scala della miniatura sull'asse (rullino)
  const BIG_SCALE   = 0.38;   // scala al momento dell'esplosione centrale

  // 5) DISPERSIONE all'esplosione — distribuzione CIRCOLARE.
  //    Raggio massimo come frazione del lato minore della viewport.
  //    Più alto = esplosione più ampia.
  const SPREAD_RADIUS = 0.50;
  const MAX_ROT  = 5;         // ± rotazione Z (gradi) -> collage di stampe
  const MAX_ROTX = 8;         // ± rotazione X (gradi) -> inclinazione avanti/indietro
  const MAX_ROTY = 8;         // ± rotazione Y (gradi) -> tocco 3D
  const MAX_Z    = 250;       // ± profondità Z (px) -> vicinanza/lontananza reale

  /* ============================================================
     LOGICA  (di norma non serve toccare oltre questo punto)
     ============================================================ */

  const stage = document.getElementById('scene');

  // estremi orizzontali del percorso (ricalcolati a runtime per il resize)
  // FLUSSO: da SINISTRA verso DESTRA
  const startX = () => -(window.innerWidth / 2) - 700;    // ingresso da sinistra (margine extra per rotazione scena)
  const endX   = () =>  (window.innerWidth / 2) + 700;    // uscita a destra

  // sorgente immagini sequenziale e z-index incrementale (stratificazione)
  let imgCounter = 0;
  let zCounter   = 1;
  const nextSrc = () => imageSources[imgCounter++ % imageSources.length];

  // costruisce un singolo contenitore del pool
  function createCard(index) {
    const card  = document.createElement('div');
    card.className = 'card';

    const inner = document.createElement('div');
    inner.className = 'inner';

    const img = document.createElement('img');
    img.src = nextSrc();
    img.alt = '';

    inner.appendChild(img);
    card.appendChild(inner);
    stage.appendChild(card);

    // stato randomico per-ciclo (rigenerato ad ogni giro -> ogni foto è diversa)
    const st = { y: 0, x: 0, z: 0, rot: 0, rotX: 0, rotY: 0, driftX: 0, driftY: 0, driftRot: 0, scale: BIG_SCALE };
    const reroll = () => {
      const maxR  = SPREAD_RADIUS * Math.min(window.innerWidth, window.innerHeight);
      const r     = Math.sqrt(gsap.utils.random(0, 1)) * maxR;
      const angle = gsap.utils.random(-Math.PI / 2, Math.PI / 2);
      st.x    = Math.cos(angle) * r;
      st.y    = Math.sin(angle) * r;
      st.z    = gsap.utils.random(-MAX_Z, MAX_Z);
      st.rot  = gsap.utils.random(-MAX_ROT,  MAX_ROT);
      st.rotX = gsap.utils.random(-MAX_ROTX, MAX_ROTX);
      st.rotY = gsap.utils.random(-MAX_ROTY, MAX_ROTY);
      st.scale = gsap.utils.random(0.30, 0.46);
      st.driftX   = gsap.utils.random(10, 50);
      st.driftY   = gsap.utils.random(-25, 25);
      st.driftRot = gsap.utils.random(-2, 2);
    };
    reroll();

    // stato iniziale.
    // card: solo opacità (il flusso x lo imposta la fromTo qui sotto).
    // inner: centraggio + scala miniatura + dispersione a zero.
    gsap.set(card,  { opacity: 1, z: 0 });
    gsap.set(inner, { xPercent: -50, yPercent: -50, scale: THUMB_SCALE, rotation: 0, rotationX: 0, rotationY: 0, x: 0, y: 0 });

    const D = FLOW_DURATION;

    // timeline infinita; repeatRefresh ri-valuta i valori function-based ad ogni giro
    const tl = gsap.timeline({
      repeat: -1,
      repeatRefresh: true,
      delay: -(index / POOL_SIZE) * D,
      onRepeat: () => {                  // riciclo: nuova immagine + nuovo z + nuovo random
        img.src = nextSrc();
        reroll();
      }
    });

    // --- FLUSSO ORIZZONTALE: lineare per tutta la durata (scorrimento costante) ---
    tl.fromTo(card,
      { x: startX },
      { x: endX, duration: D, ease: 'none' },
      0
    );

    // --- RESET all'inizio di ogni ciclo: miniatura sull'asse ---
    tl.set(card, { z: 0 }, 0.001);
    tl.set(inner, {
      scale: THUMB_SCALE, x: 0, y: 0, rotation: 0, rotationX: 0, rotationY: 0
    }, 0.001);

    // --- FASE 2: ESPLOSIONE CENTRALE ---
    // profondità Z sulla card (figlio diretto di #stage -> usa la perspective)
    tl.to(card, {
      z: () => st.z,
      duration: D * 0.18,
      ease: 'power1.out'
    }, D * 0.44);

    tl.to(inner, {
      scale: () => st.scale,
      x: () => st.x,
      y: () => st.y,
      rotation: () => st.rot,
      rotationX: () => st.rotX,
      rotationY: () => st.rotY,
      duration: D * 0.18,
      ease: 'power1.out'
    }, D * 0.44);

    // ombra dinamica in base alla profondità Z
    tl.call(() => {
      card.style.zIndex = ++zCounter;
      const depth = (st.z + MAX_Z) / (MAX_Z * 2);
      const blur = 8 + depth * 15;
      const offsetY = 4 + depth * 10;
      const opacity = 0.10 + depth * 0.15;
      img.style.boxShadow = `0 ${offsetY|0}px ${blur|0}px rgba(0,0,0,${opacity.toFixed(2)})`;
    }, null, D * 0.44);

    // --- DRIFT POST-ESPLOSIONE ---
    tl.to(inner, {
      x: () => st.x + st.driftX,
      y: () => st.y + st.driftY,
      rotation: () => st.rot + st.driftRot,
      duration: D * 0.42,
      ease: 'sine.inOut'
    }, D * 0.62);

    return tl;
  }

  // genera l'intero pool
  for (let i = 0; i < POOL_SIZE; i++) createCard(i);

  // mantieni il flusso fluido anche dopo un cambio dimensione finestra:
  // startX/endX sono function-based + repeatRefresh, quindi si adattano al giro
  // successivo. Forziamo solo un refresh leggero su resize.
  let resizeT;
  window.addEventListener('resize', () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => gsap.globalTimeline.getChildren().forEach(t => t.invalidate()), 200);
  });
  </script>
</body>
</html>
