<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>if (location.search.indexOf('card') !== -1) document.documentElement.classList.add('card-preview');</script>
  <style>.card-preview .hud,.card-preview .theme-toggle{display:none!important}.card-preview #logo-mount{top:0}</style>
  <title>VILYA — Liquid Halftone Motion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- LAYER 1 · halftone wave field -->
  <canvas id="halftone" aria-hidden="true"></canvas>

  <!-- LAYER 2 · liquid logo (SVGs are fetched + injected here at runtime) -->
  <main id="stage">
    <div id="logo-mount" role="img" aria-label="Vilya logo, liquid motion"></div>
  </main>

  <!-- HUD -->
  <header class="hud hud--tl"><span class="brand">VILYA</span></header>
  <div class="hud hud--tr">
    <svg class="hud__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M12 21s-7-5.686-7-11a7 7 0 1 1 14 0c0 5.314-7 11-7 11Z" stroke="currentColor" stroke-width="2"/>
      <circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="2"/>
    </svg>
    San&nbsp;Francisco,&nbsp;CA
  </div>
  <div class="hud hud--bl"><span class="hud__label">COMPUTE BEYOND NATURE</span><span class="hud__sub">AI-driven microcycles design</span></div>

  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle light / night mode">
    <span class="theme-toggle__track">
      <span class="theme-toggle__thumb">
        <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/>
          <path d="M12 2v2M12 20v2M4 12H2M22 12h-2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </span>
    </span>
  </button>

  <!-- classic scripts, in dependency order: the page also runs from file:// -->
  <script src="js/config.js"></script>
  <script src="js/halftone.js"></script>
  <script src="js/gooLogo.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
